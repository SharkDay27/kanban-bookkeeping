<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="每日記帳">
<title>每日 Kanban 記帳</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;--danger:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:80px}
.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:22px;margin:0}.sub,.note{color:var(--muted);font-size:12px}.actions,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button,.btn,input,select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font:inherit}.btn{display:inline-block;cursor:pointer}.btn input{display:none}.primary{background:#111827;color:#fff}.danger{color:var(--danger)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.stat b{font-size:21px;display:block;margin-top:3px}.stat span{font-size:11px;color:var(--muted)}
.board{display:flex;gap:10px;overflow-x:auto;align-items:flex-start}.day{min-width:300px;width:300px;background:#eceff4;border-radius:14px;padding:9px}.dayhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}.dayhead b{font-size:15px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:8px}.row{display:flex;justify-content:space-between;gap:8px}.store{font-weight:700}.amt{font-weight:800}.badges{margin-top:6px}.badge{display:inline-block;background:#f3f4f6;border-radius:999px;padding:3px 7px;font-size:10px;margin:0 4px 4px 0}.items{font-size:12px;color:#4b5563;margin-top:5px}.small{font-size:11px;padding:6px 8px;margin-top:8px}.empty{text-align:center;color:var(--muted);padding:36px;background:#fff;border:1px dashed var(--line);border-radius:14px}
dialog{border:0;border-radius:16px;width:min(560px,calc(100% - 20px));padding:0}form{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;color:var(--muted)}textarea{min-height:70px;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.bottom{display:none}
@media(max-width:700px){.wrap{padding:10px}.stats{grid-template-columns:1fr 1fr}.actions{display:grid;grid-template-columns:1fr 1fr}.actions>*{width:100%;text-align:center}.board{display:block;overflow:visible}.day{width:100%;min-width:0;margin-bottom:10px}.filters{display:grid;grid-template-columns:1fr 1fr;position:sticky;top:0;background:rgba(246,247,251,.96);padding:8px 0;z-index:5}.filters input{grid-column:1/-1}.grid{grid-template-columns:1fr}.bottom{display:grid;grid-template-columns:repeat(3,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px calc(7px + env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) calc(7px + env(safe-area-inset-left));z-index:10}.bottom button{border:0}.fab{position:fixed;right:16px;bottom:76px;width:54px;height:54px;border-radius:50%;border:0;background:#111827;color:#fff;font-size:28px;z-index:11}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>每日 Kanban 記帳</h1><div class="sub">GitHub Pages 安全版｜網站檔案不包含你的發票資料</div></div></div>
  <div class="note">帳目只保存在目前瀏覽器的 localStorage。換手機、清除 Safari 網站資料或使用私人瀏覽前，請先備份 JSON。</div>
  <div class="actions">
    <label class="btn">匯入發票 CSV<input id="csv" type="file" accept=".csv" multiple></label>
    <button id="export">匯出 CSV</button>
    <button id="backup">備份 JSON</button>
    <label class="btn">還原 JSON<input id="restore" type="file" accept=".json"></label>
    <button id="clear" class="danger">清除本機資料</button>
    <button id="add" class="primary">＋新增支出</button>
  </div>
  <div class="stats">
    <div class="stat"><span>總支出</span><b id="total">$0</b></div>
    <div class="stat"><span>平均每日</span><b id="avg">$0</b></div>
    <div class="stat"><span>最高單日</span><b id="max">$0</b></div>
    <div class="stat"><span>筆數</span><b id="count">0</b></div>
  </div>
  <div class="filters">
    <input id="month" type="month">
    <select id="cat"><option value="">所有分類</option></select>
    <input id="q" placeholder="搜尋店家、品項、備註">
  </div>
  <div id="board"></div>
</div>
<button class="fab" id="fab">＋</button>
<div class="bottom"><button id="goBoard">看板</button><button id="goImport">匯入</button><button id="goBackup">備份</button></div>
<dialog id="dlg">
<form method="dialog">
<h3 id="dlgTitle">新增支出</h3>
<input id="eid" type="hidden">
<div class="grid">
<div class="field"><label>日期</label><input id="edate" type="date" required></div>
<div class="field"><label>金額</label><input id="eamt" type="number" step="1" required></div>
<div class="field"><label>店家／用途</label><input id="estore" required></div>
<div class="field"><label>分類</label><select id="ecat"></select></div>
<div class="field"><label>付款方式</label><select id="epay"><option>未設定</option><option>現金</option><option>信用卡</option><option>悠遊卡</option><option>LINE Pay</option><option>轉帳</option><option>其他</option></select></div>
<div class="field"><label>備註</label><textarea id="enote"></textarea></div>
</div>
<div class="foot"><button value="cancel">取消</button><button type="button" id="del" class="danger">刪除</button><button type="button" id="save" class="primary">儲存</button></div>
</form></dialog>
<script>
const KEY="kanban-bookkeeping-safe-v1",CATS=["餐飲","飲料","便利商店","交通","購物","訂閱/數位","娛樂","醫療","生活用品","其他"];
let data=(()=>{try{let x=JSON.parse(localStorage.getItem(KEY)||"[]");return Array.isArray(x)?x:[]}catch{return[]}})();
const $=id=>document.getElementById(id),money=n=>"$"+Math.round(Number(n)||0).toLocaleString("zh-TW"),esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(data))}
function cats(){return [...new Set([...CATS,...data.map(x=>x.category).filter(Boolean)])]}
function refreshCats(){const a=cats(),v=$("cat").value;$("cat").innerHTML='<option value="">所有分類</option>'+a.map(x=>'<option>'+esc(x)+'</option>').join("");$("cat").value=v;$("ecat").innerHTML=a.map(x=>'<option>'+esc(x)+'</option>').join("")}
function filtered(){const m=$("month").value,c=$("cat").value,q=$("q").value.trim().toLowerCase();return data.filter(x=>(!m||x.date.startsWith(m))&&(!c||x.category===c)&&(!q||[x.store,x.note,x.invoice,...(x.items||[]).map(i=>i.name)].join(" ").toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date)||b.amount-a.amount)}
function render(){refreshCats();const rows=filtered(),by={};rows.forEach(x=>(by[x.date]??=[]).push(x));const days=Object.keys(by).sort().reverse(),sums=Object.fromEntries(days.map(d=>[d,by[d].reduce((s,x)=>s+Number(x.amount||0),0)])),tot=Object.values(sums).reduce((a,b)=>a+b,0);$("total").textContent=money(tot);$("avg").textContent=money(days.length?tot/days.length:0);$("max").textContent=money(days.length?Math.max(...Object.values(sums)):0);$("count").textContent=rows.length;$("board").innerHTML=days.length?'<div class="board">'+days.map(d=>'<section class="day"><div class="dayhead"><b>'+esc(d)+'</b><b>'+money(sums[d])+'</b></div>'+by[d].map(card).join("")+'</section>').join("")+'</div>':'<div class="empty">尚未有記帳資料。請匯入 CSV 或新增支出。</div>';document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(b.dataset.edit))}
function card(x){return '<article class="card"><div class="row"><div class="store">'+esc(x.store)+'</div><div class="amt">'+money(x.amount)+'</div></div><div class="badges"><span class="badge">'+esc(x.category)+'</span><span class="badge">'+esc(x.payment||"未設定")+'</span></div><div class="items">'+(x.items||[]).slice(0,3).map(i=>esc(i.name)).join("、")+'</div><button class="small" data-edit="'+esc(x.id)+'">編輯</button></article>'}
function openEdit(id){let x=id?data.find(v=>v.id===id):null;$("dlgTitle").textContent=x?"編輯支出":"新增支出";$("eid").value=x?.id||"";$("edate").value=x?.date||new Date().toISOString().slice(0,10);$("eamt").value=x?.amount??"";$("estore").value=x?.store||"";$("ecat").value=x?.category||"其他";$("epay").value=x?.payment||"未設定";$("enote").value=x?.note||"";$("del").style.display=x?"":"none";$("dlg").showModal()}
$("save").onclick=()=>{const id=$("eid").value,old=data.find(x=>x.id===id);const o={...(old||{}),id:id||"manual-"+Date.now(),date:$("edate").value,amount:Number($("eamt").value||0),store:$("estore").value.trim()||"未命名支出",category:$("ecat").value,payment:$("epay").value,note:$("enote").value.trim(),source:old?.source||"手動",items:old?.items||[]};data=id?data.map(x=>x.id===id?o:x):[...data,o];saveLocal();$("dlg").close();render()}
$("del").onclick=()=>{let id=$("eid").value;if(id&&confirm("確定刪除？")){data=data.filter(x=>x.id!==id);saveLocal();$("dlg").close();render()}}
function csvRows(t){let r=[],row=[],f="",q=false;for(let i=0;i<t.length;i++){let c=t[i],n=t[i+1];if(q){if(c=='"'&&n=='"'){f+='"';i++}else if(c=='"')q=false;else f+=c}else if(c=='"')q=true;else if(c==","){row.push(f);f=""}else if(c=="\n"){row.push(f);r.push(row);row=[];f=""}else if(c!="\r")f+=c}if(f||row.length){row.push(f);r.push(row)}if(!r.length)return[];let h=r.shift();return r.filter(x=>x.some(Boolean)).map(x=>Object.fromEntries(h.map((k,i)=>[k,x[i]||""])))}
function autoCat(s,it){let t=(s+" "+it.join(" ")).toLowerCase(),rules=[["便利商店",["統一超商","7-eleven","全家便利","萊爾富"]],["飲料",["茶","咖啡","飲料","鮮奶","拿鐵"]],["交通",["捷運","台鐵","高鐵","uber","停車"]],["訂閱/數位",["apple","google","icloud","netflix","spotify"]],["餐飲",["餐盒","便當","早餐","午餐","晚餐","飯","麵","餐廳"]]];for(let [c,k] of rules)if(k.some(z=>t.includes(z)))return c;return"其他"}
$("csv").onchange=async e=>{for(const f of e.target.files){let rows=csvRows((await f.text()).replace(/^\ufeff/,"")),g={};rows.forEach(r=>{let inv=(r["發票號碼"]||"").trim(),d=(r["發票日期"]||"").trim();if(inv&&/^\d{8}$/.test(d))(g[inv]??=[]).push(r)});for(const [inv,rs] of Object.entries(g)){let d=rs[0]["發票日期"],date=d.slice(0,4)+"-"+d.slice(4,6)+"-"+d.slice(6),store=(rs[0]["賣方名稱"]||"未命名店家").trim(),items=rs.map(r=>({name:(r["消費明細_品名"]||"未提供品名").trim(),amount:Number(r["消費明細_金額"]||r["發票金額"]||0)})),amount=items.reduce((s,i)=>s+i.amount,0),id="inv-"+inv,old=data.find(x=>x.id===id),o={id,date,invoice:inv,store,amount,items,category:old?.category||autoCat(store,items.map(i=>i.name)),payment:old?.payment||"未設定",note:old?.note||"",source:"電子發票"};data=old?data.map(x=>x.id===id?o:x):[...data,o]}}saveLocal();render();e.target.value=""}
function dl(n,c,t){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
$("backup").onclick=()=>dl("kanban記帳備份.json",JSON.stringify(data,null,2),"application/json");
$("restore").onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw 0;if(confirm("用此備份取代目前資料？")){data=x;saveLocal();render()}}catch{alert("無效的 JSON 備份")}e.target.value=""}
$("export").onclick=()=>{let h=["日期","店家/用途","金額","分類","付款方式","發票號碼","備註"],r=[h,...filtered().map(x=>[x.date,x.store,x.amount,x.category,x.payment,x.invoice||"",x.note||""])],q=v=>/[",\n]/.test(String(v))?'"'+String(v).replaceAll('"','""')+'"':v;dl("kanban記帳匯出.csv","\ufeff"+r.map(x=>x.map(q).join(",")).join("\n"),"text/csv;charset=utf-8")}
$("clear").onclick=()=>{if(confirm("確定清除這台裝置上的所有記帳資料？")){data=[];saveLocal();render()}}
$("add").onclick=$("fab").onclick=()=>openEdit();$("goImport").onclick=()=>$("csv").click();$("goBackup").onclick=()=>$("backup").click();$("goBoard").onclick=()=>scrollTo({top:0,behavior:"smooth"});["month","cat","q"].forEach(id=>$(id).oninput=render);$("month").value=new Date().toISOString().slice(0,7);render();
</script>
</body></html>
